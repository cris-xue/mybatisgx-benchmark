spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mybatisgx_benchmark?rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      auto-commit: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

mybatis-flex:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.benchmark.mybatisflex.entity
  configuration:
    databaseId: MySQL
    lazy-loading-enabled: true
    aggressiveLazyLoading: false
    lazyLoadTriggerMethods: get
    map-underscore-to-camel-case: true
    cache-enabled: false
    # log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl